const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayISO = () => isoLocal(new Date());
const tgl = s => !s ? '-' : new Date(s + 'T00:00:00').toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
const maskHp = hp => (hp && hp.length > 7) ? hp.slice(0, 4) + '••••' + hp.slice(-3) : (hp || '-');
const ymOf = s => (s || '').slice(0, 7);
const thisYm = () => todayISO().slice(0, 7);
function shiftYm(ym, n) {
  const p = ym.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function ymLabel(ym) {
  return new Date(ym + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
}
function waLink(hp) {
  let n = (hp || '').replace(/\D/g, '');
  if (n.startsWith('0')) n = '62' + n.slice(1);
  else if (n.startsWith('8')) n = '62' + n;
  return 'https://wa.me/' + n;
}
function shiftDate(d, n) {
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
}
function jatuhTempo(p) {
  const d = new Date(p.TglMasuk + 'T00:00:00');
  if (isNaN(d)) return '-';
  const step = p.Tipe === 'Tahunan' ? 12 : 1;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  let guard = 0;
  while (d < now && guard < 240) { shiftDate(d, step); guard++; }
  return isoLocal(d);
}
function durasiSewa(p) {
  const a = new Date(p.TglMasuk + 'T00:00:00');
  if (isNaN(a)) return '-';
  const b = new Date((p.TglKeluar || todayISO()) + 'T00:00:00');
  if (b < a) return '-';
  let months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) months--;
  months = Math.max(0, months);
  const anchor = new Date(a.getTime());
  shiftDate(anchor, months);
  const days = Math.max(0, Math.round((b - anchor) / 86400000));
  const thn = Math.floor(months / 12), bln = months % 12;
  const parts = [];
  if (thn) parts.push(thn + ' thn');
  if (bln) parts.push(bln + ' bln');
  if (days || !parts.length) parts.push(days + ' hr');
  return parts.join(' ');
}

/* ========================= DATA MOCK (format identik dgn respon backend) ========================= */

    { ID: 'P6', Nama: 'Hendra Wijaya', NoHP: '081399988877', Tipe: 'Bulanan', TglMasuk: '2025-11-01', TglKeluar: '2026-05-20', KamarID: 'K4', StatusBayar: 'Sudah Bayar', Notes: 'Pindah, kontrak selesai.' }
  ],

    { ID: 'T1', Tipe: 'Masuk', Nama: 'Andi Saputra', Jumlah: 900000, Tgl: '2026-08-01', Ket: 'Sewa bulanan' },

    { ID: 'T8', Tipe: 'Masuk', Nama: 'Andi Saputra', Jumlah: 900000, Tgl: '2026-09-01', Ket: 'Sewa bulanan' },
    { ID: 'T9', Tipe: 'Masuk', Nama: 'Dewi Lestari', Jumlah: 1000000, Tgl: '2026-09-02', Ket: 'Sewa bulanan' },
    { ID: 'T10', Tipe: 'Keluar', Nama: 'Listrik', Jumlah: 430000, Tgl: '2026-09-05', Ket: 'Tagihan listrik September' },
    { ID: 'T11', Tipe: 'Keluar', Nama: 'Air', Jumlah: 150000, Tgl: '2026-09-10', Ket: 'Air bersih' },
    { ID: 'T12', Tipe: 'Keluar', Nama: 'Perbaikan', Jumlah: 220000, Tgl: '2026-09-12', Ket: 'Ganti kran A2' }
  ]
};
const STORE_KEY = 'kostchamel_db_v1';
const seedDb = () => JSON.parse(JSON.stringify(SEED));
function validDb(x) {
  return !!(x && Array.isArray(x.kamar) && Array.isArray(x.penghuni) && Array.isArray(x.transaksi));
}
let db = loadDb();
function loadDb() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (validDb(parsed)) return parsed;
    }
  } catch (e) {}
  return seedDb();
}
function saveDb() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {}
}
const ok = data => ({ success: true, data: data });
const fail = message => ({ success: false, message: message });
const delay = ms => new Promise(r => setTimeout(r, ms));

/* ========================= API (MOCK + FETCH GAS) ========================= */
async function mockApi(action, payload) {
  await delay(150);
  payload = payload || {};
  switch (action) {
    case 'listKamar': return ok(db.kamar);
    case 'addKamar': {
      const no = String(payload.No || '').trim();
      if (!no) return fail('No kamar wajib diisi');
      if (db.kamar.some(k => k.No === no)) return fail('No kamar sudah dipakai');
      const item = { ID: 'K' + Date.now(), No: no, Fasilitas: payload.Fasilitas || '', Harga: Number(payload.Harga) || 0, Status: payload.Status || 'Kosong' };
      db.kamar.push(item); saveDb(); return ok(item);
    }
    case 'updateKamar': {
      const i = db.kamar.findIndex(k => k.ID === payload.ID);
      if (i < 0) return fail('Kamar tidak ditemukan');
      if (payload.No !== undefined) {
        const no = String(payload.No || '').trim();
        if (!no) return fail('No kamar wajib diisi');
        if (db.kamar.some((k, idx) => idx !== i && k.No === no)) return fail('No kamar sudah dipakai');
        payload = Object.assign({}, payload, { No: no });
      }
      db.kamar[i] = Object.assign(db.kamar[i], payload); saveDb(); return ok(db.kamar[i]);
    }
    case 'deleteKamar': {
      const i = db.kamar.findIndex(k => k.ID === payload.ID);
      if (i < 0) return fail('Kamar tidak ditemukan');
      if (db.penghuni.some(p => p.KamarID === payload.ID && !p.TglKeluar)) return fail('Kamar masih dihuni penghuni — pindahkan/tandai keluar dulu');
      const removed = db.kamar.splice(i, 1)[0];
      saveDb(); return ok(removed);
    }
    case 'listPenghuni': return ok(db.penghuni);
    case 'addPenghuni': {
      if (!String(payload.Nama || '').trim()) return fail('Nama wajib diisi');
      const hp = String(payload.NoHP || '').replace(/\D/g, '');
      if (hp.length < 10) return fail('No HP minimal 10 digit angka');
      if (!payload.TglMasuk) return fail('Tanggal masuk wajib diisi');
      const item = {
        ID: 'P' + Date.now(), Nama: payload.Nama.trim(), NoHP: hp,
        Tipe: payload.Tipe || 'Bulanan', TglMasuk: payload.TglMasuk,
        KamarID: payload.KamarID || '', StatusBayar: 'Belum Bayar', Notes: payload.Notes || ''
      };
      db.penghuni.push(item);
      const k = db.kamar.find(k => k.ID === item.KamarID);
      if (k) k.Status = 'Terisi';
      saveDb(); return ok(item);
    }
    case 'updatePenghuni': {
      const i = db.penghuni.findIndex(p => p.ID === payload.ID);
      if (i < 0) return fail('Penghuni tidak ditemukan');
      db.penghuni[i] = Object.assign(db.penghuni[i], payload); saveDb(); return ok(db.penghuni[i]);
    }
    case 'listTransaksi': return ok(db.transaksi);
    case 'addTransaksi': {
      if (!(Number(payload.Jumlah) > 0)) return fail('Jumlah harus lebih dari Rp 0');
      if (!payload.Tgl) return fail('Tanggal wajib diisi');
      if (payload.Tipe === 'Masuk' && !payload.Nama) return fail('Pilih nama penghuni');
      const item = {
        ID: 'T' + Date.now(), Tipe: payload.Tipe, Nama: payload.Nama || '-',
        Jumlah: Number(payload.Jumlah), Tgl: payload.Tgl, Ket: payload.Ket || ''
      };
      db.transaksi.unshift(item);
      if (item.Tipe === 'Masuk') {
        const p = db.penghuni.find(p => p.Nama === item.Nama);
        if (p) p.StatusBayar = 'Sudah Bayar';
      }
      saveDb(); return ok(item);
    }
    default: return fail('Aksi tidak dikenal: ' + action);
  }
}
async function api(action, payload) {
  if (USE_MOCK) return mockApi(action, payload);
  const url = GAS_URL[GAS_ENV] || '';
  if (!url) return fail('Endpoint GAS belum diisi (isi GAS_URL.' + GAS_ENV + ')');
  const body = JSON.stringify({ action: action, payload: payload || {}, adminKey: auth.admin ? ADMIN_PASSWORD : '' });
  const req = async () => {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body,
      redirect: 'follow'
    });
    const data = await res.json();
    if (!data || (data.success !== true && data.success !== false)) throw new Error('respon tidak valid');
    return data;
  };
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      return await req();
    } catch (e) {
      if (attempt === 0) await new Promise(r => setTimeout(r, 900));
      else if (attempt === 1) await new Promise(r => setTimeout(r, 2200));
    }
  }
  return fail('Gagal terhubung ke server');
}

/* ========================= STORE GLOBAL & UI ========================= */
const store = Vue.reactive({ kamar: [], penghuni: [], transaksi: [] });
const ui = Vue.reactive({ toast: { msg: '', type: 'success' } });
let toastTimer = null;
function toast(msg, type) {
  ui.toast = { msg: msg, type: type || 'success' };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { ui.toast.msg = ''; }, 2600);
}
async function refresh() {
  const [k, p, t] = await Promise.all([api('listKamar'), api('listPenghuni'), api('listTransaksi')]);
  if (k.success) store.kamar = k.data || [];
  if (p.success) store.penghuni = p.data || [];
  if (t.success) store.transaksi = t.data || [];
  // self-haling: bila MOCK storage korup/kosong total, muat ulang data contoh (non-MOCK: skip)
  if (USE_MOCK && !store.kamar.length && !store.penghuni.length && !store.transaksi.length) {
    db = seedDb();
    saveDb();
    const again = await Promise.all([api('listKamar'), api('listPenghuni'), api('listTransaksi')]);
    if (again[0].success) store.kamar = again[0].data || [];
    if (again[1].success) store.penghuni = again[1].data || [];
    if (again[2].success) store.transaksi = again[2].data || [];
  }
}
function kamarNo(id) {
  const k = store.kamar.find(k => k.ID === id);
  return k ? k.No : '-';
}

/* ========================= AUTH ADMIN ========================= */
const auth = Vue.reactive({
  admin: (function () { try { return sessionStorage.getItem('kostchamel_admin') === '1'; } catch (e) { return false; } })()

  if (String(pw) !== ADMIN_PASSWORD) return false;
  auth.admin = true;
  try { sessionStorage.setItem('kostchamel_admin', '1'); } catch (e) {}
  return true;
}
function logout() {
  auth.admin = false;
  try { sessionStorage.removeItem('kostchamel_admin'); } catch (e) {}
}
function needsAdmin(route) {
  return ADMIN_ROUTES.some(r => route === r || route.startsWith(r + '/'));
}

/* ========================= KOMPONEN ========================= */

const BerandaView = {
  computed: {
    masuk() { return store.transaksi.filter(t => t.Tipe === 'Masuk').reduce((a, b) => a + b.Jumlah, 0); },
    keluar() { return store.transaksi.filter(t => t.Tipe === 'Keluar').reduce((a, b) => a + b.Jumlah, 0); },
    saldo() { return this.masuk - this.keluar; },
    terisi() { return store.kamar.filter(k => k.Status === 'Terisi').length; },

const KamarView = {
  data() {
    return { sel: null, showAdd: false, showEdit: false, confirmHapus: false, busy: false, err: '', form: { No: '', Fasilitas: '', Harga: '', Status: 'Kosong' }, formEdit: { ID: '', No: '', Fasilitas: '', Harga: '' } };
  },
  methods: {
    open(k) { this.sel = k; },
    async toggleStatus() {
      const next = this.sel.Status === 'Terisi' ? 'Kosong' : 'Terisi';
      const r = await api('updateKamar', { ID: this.sel.ID, Status: next });
      if (r.success) {
        await refresh();
        this.sel = store.kamar.find(k => k.ID === r.data.ID) || null;
        toast('Status kamar diperbarui');
      } else toast(r.message, 'error');
    },
    bukaEdit() {
      this.err = '';
      this.confirmHapus = false;
      this.formEdit = { ID: this.sel.ID, No: this.sel.No, Fasilitas: this.sel.Fasilitas, Harga: this.sel.Harga };
      this.showEdit = true;
    },
    async simpanEdit() {
      this.err = '';
      const no = String(this.formEdit.No || '').trim();
      if (!no) { this.err = 'No kamar wajib diisi'; return; }
      if (store.kamar.some(x => x.No === no && x.ID !== this.formEdit.ID)) { this.err = 'No kamar sudah dipakai'; return; }
      if (!(Number(this.formEdit.Harga) > 0)) { this.err = 'Harga sewa harus lebih dari Rp 0'; return; }
      this.formEdit.No = no;
      this.busy = true;
      const r = await api('updateKamar', this.formEdit);
      this.busy = false;
      if (r.success) {
        await refresh();
        this.sel = store.kamar.find(k => k.ID === r.data.ID) || null;
        this.showEdit = false;
        this.confirmHapus = false;
        toast('Kamar diperbarui');
      } else toast(r.message, 'error');
    },
    async hapus() {
      if (!this.confirmHapus) { this.confirmHapus = true; return; }
      this.err = '';
      this.busy = true;
      const r = await api('deleteKamar', { ID: this.formEdit.ID });
      this.busy = false;
      this.confirmHapus = false;
      if (r.success) {
        await refresh();
        this.showEdit = false;
        this.sel = null;
        toast('Kamar berhasil dihapus');
      } else {
        this.err = r.message;
        toast(r.message, 'error');
      }
    },
    async tambah() {
      this.err = '';
      if (!this.form.No.trim()) { this.err = 'No kamar wajib diisi'; return; }
      if (store.kamar.some(k => k.No === this.form.No.trim())) { this.err = 'No kamar sudah dipakai'; return; }
      if (!(Number(this.form.Harga) > 0)) { this.err = 'Harga sewa harus lebih dari Rp 0'; return; }
      this.busy = true;
      const r = await api('addKamar', this.form);
      this.busy = false;
      if (r.success) {
        await refresh(); this.showAdd = false;
        this.form = { No: '', Fasilitas: '', Harga: '', Status: 'Kosong' };
        toast('Kamar berhasil ditambahkan');
      } else toast(r.message, 'error');
    }
  },
  template: `

    <div class="px-4 mt-4 flex justify-between items-center">

          </div>
        </div>
      </div>
    </transition>

    <transition name="modal">
      <div v-if="showAdd" class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center" @click.self="showAdd = false">
        <form @submit.prevent="tambah" class="bg-surface w-full max-w-md rounded-t-[20px] p-5 pb-8">
          <div class="sheet-handle"></div>
          <h2 class="text-[18px] font-bold mb-4">Tambah Kamar</h2>

          <input v-model="form.No" class="field mb-3" placeholder="cth. A5">
          <label class="label">Fasilitas</label>
          <textarea v-model="form.Fasilitas" rows="2" class="field mb-3" placeholder="pisahkan dengan koma"></textarea>
          <label class="label">Harga Sewa / bulan</label>
          <input v-model="form.Harga" type="number" inputmode="numeric" min="1" class="field mb-3" placeholder="850000">
          <p v-if="err" class="text-[12px] text-danger mb-3">{{ err }}</p>
          <div class="flex gap-2">
            <button type="button" @click="showAdd = false" class="btn btn-ghost flex-1 py-3 text-[14px]">Batal</button>
            <button type="submit" :disabled="busy" class="btn btn-brand flex-1 py-3 text-[14px]">{{ busy ? 'Menyimpan…' : 'Simpan' }}</button>
          </div>
        </form>
      </div>
    </transition>

    <transition name="modal">
      <div v-if="showEdit" class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center" @click.self="showEdit = false">
        <form @submit.prevent="simpanEdit" class="bg-surface w-full max-w-md rounded-t-[20px] p-5 pb-8">
          <div class="sheet-handle"></div>
          <h2 class="text-[18px] font-bold mb-4">Edit Kamar</h2>
          <label class="label">No Kamar</label>
          <input v-model="formEdit.No" class="field mb-3" placeholder="cth. A1">
          <label class="label">Fasilitas</label>
          <textarea v-model="formEdit.Fasilitas" rows="3" class="field mb-3" placeholder="pisahkan dengan koma"></textarea>
          <label class="label">Harga Sewa / bulan</label>
          <input v-model="formEdit.Harga" type="number" inputmode="numeric" min="1" class="field mb-3">

            :class="confirmHapus ? 'bg-danger text-white' : 'bg-red-50 text-danger'">
            {{ busy ? 'Memproses…' : (confirmHapus ? 'Tap sekali lagi untuk hapus permanen' : '🗑 Hapus Kamar') }}

};

      let arr = store.penghuni.slice();
      if (this.filter === 'belum') arr = arr.filter(p => p.StatusBayar === 'Belum Bayar');
      const q = this.q.trim().toLowerCase();
      if (q.length >= 2) {
        arr = arr.filter(p => p.Nama.toLowerCase().includes(q) || p.NoHP.includes(q) || kamarNo(p.KamarID).toLowerCase().includes(q));
      }
      return arr;

    open(p) { this.sel = p; this.draftNotes = p.Notes || ''; },
    async simpanNotes() {
      this.busy = true;
      const r = await api('updatePenghuni', { ID: this.sel.ID, Notes: this.draftNotes });
      this.busy = false;
      if (r.success) { await refresh(); this.sel = null; toast('Catatan tersimpan'); }
      else toast(r.message, 'error');

      this.busy = true;
      const r = await api('updatePenghuni', { ID: this.sel.ID, TglKeluar: todayISO() });
      if (r.success && this.sel.KamarID) await api('updateKamar', { ID: this.sel.KamarID, Status: 'Kosong' });

      if (r.success) {
        await refresh();
        this.sel = store.penghuni.find(p => p.ID === r.data.ID) || null;

const LaporanView = {
  data() {
    return { mode: 'bulanan', ym: thisYm(), year: Number(thisYm().slice(0, 4)) };
  },
  computed: {
    /* ---------- BULANAN ---------- */
    minYm() {
      const ts = store.transaksi.map(t => ymOf(t.Tgl)).sort();
      return ts[0] || thisYm();
    },
    trx() {
      return store.transaksi
        .filter(t => ymOf(t.Tgl) === this.ym)
        .sort((a, b) => b.Tgl.localeCompare(a.Tgl));
    },
    masuk() { return this.trx.filter(t => t.Tipe === 'Masuk').reduce((a, b) => a + b.Jumlah, 0); },
    keluar() { return this.trx.filter(t => t.Tipe === 'Keluar').reduce((a, b) => a + b.Jumlah, 0); },
    laba() { return this.masuk - this.keluar; },
    barMax() { return Math.max(this.masuk, this.keluar, 1); },
    canPrev() { return this.ym > this.minYm; },
    canNext() { return this.ym < thisYm(); },
    /* ---------- TAHUNAN ---------- */
    minYear() {
      const ys = store.transaksi.map(t => Number(t.Tgl.slice(0, 4)))
        .concat(store.penghuni.map(p => Number((p.TglMasuk || '').slice(0, 4))))
        .filter(y => y > 1970);
      return ys.length ? Math.min.apply(null, ys) : Number(thisYm().slice(0, 4));
    },
    trxTahun() { return store.transaksi.filter(t => t.Tgl.slice(0, 4) === String(this.year)); },
    masukT() { return this.trxTahun.filter(t => t.Tipe === 'Masuk').reduce((a, b) => a + b.Jumlah, 0); },
    keluarT() { return this.trxTahun.filter(t => t.Tipe === 'Keluar').reduce((a, b) => a + b.Jumlah, 0); },
    labaT() { return this.masukT - this.keluarT; },
    barMaxT() { return Math.max(this.masukT, this.keluarT, 1); },
    canPrevT() { return this.year > this.minYear; },
    canNextT() { return this.year < Number(thisYm().slice(0, 4)); },
    perMonth() {
      const rows = [];
      const cur = thisYm();
      for (let m = 1; m <= 12; m++) {
        const ym = this.year + '-' + String(m).padStart(2, '0');
        if (ym > cur) break;
        const list = store.transaksi.filter(t => ymOf(t.Tgl) === ym);
        const mk = list.filter(t => t.Tipe === 'Masuk').reduce((a, b) => a + b.Jumlah, 0);
        const kl = list.filter(t => t.Tipe === 'Keluar').reduce((a, b) => a + b.Jumlah, 0);
        rows.push({
          ym: ym,
          label: new Date(ym + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'short' }),
          masuk: mk, keluar: kl, laba: mk - kl
        });
      }
      return rows;
    },
    /* ---------- RIWAYAT PENYEWA ---------- */
    riwayat() {
      return store.penghuni.slice()
        .sort((a, b) => (b.TglMasuk || '').localeCompare(a.TglMasuk || ''))
        .map(p => ({
          ID: p.ID, Nama: p.Nama, NoHP: p.NoHP, Kamar: kamarNo(p.KamarID),
          Masuk: p.TglMasuk, Keluar: p.TglKeluar || '',
          status: p.TglKeluar ? 'Keluar' : 'Aktif', durasi: durasiSewa(p)
        }));
    }
  },
  methods: {
    prev() { if (this.canPrev) this.ym = shiftYm(this.ym, -1); },
    next() { if (this.canNext) this.ym = shiftYm(this.ym, 1); },
    prevY() { if (this.canPrevT) this.year--; },
    nextY() { if (this.canNextT) this.year++; },
    width(v) { return Math.round(v / this.barMax * 100) + '%'; },
    widthT(v) { return Math.round(v / this.barMaxT * 100) + '%'; }
  },

    <div class="px-4 mt-4">
      <div class="bg-bgapp rounded-full p-1 flex gap-1">

          :class="mode === 'bulanan' ? 'bg-brand text-white' : 'text-txt2'">Bulanan</button>
        <button @click="mode = 'tahunan'" class="flex-1 text-[14px] font-extrabold rounded-full py-2.5 transition active:scale-95"

        <input v-model="pw" type="password" class="field" placeholder="••••••••" autocomplete="current-password">
        <p class="text-[10px] text-txt3 mt-1">Akses mengedit kamar, penghuni, tunggakan &amp; membuka laporan.</p>
        <button type="submit" :disabled="busy"
          class="btn btn-brand w-full mt-4 py-4 text-[16px]">{{ busy ? 'Memeriksa…' : 'Masuk' }}</button>
        <button type="button" @click="$go('#/')" class="w-full mt-2 text-[14px] font-bold text-txt2 py-2">Kembali ke Beranda</button>
      </div>
    </form>
  </div>`
};

const routes = {
  '#/': BerandaView,
  '#/login': LoginView,
  '#/kamar': KamarView,
  '#/penghuni': PenghuniView,
  '#/penghuni/baru': PenghuniBaruView,
  '#/pemasukan': PemasukanView,
  '#/pengeluaran': PengeluaranView,
  '#/laporan': LaporanView,
  '#/tunggakan': TunggakanView
};

const app = createApp({
  data() {
    return { route: location.hash || '#/' };
  },
  computed: {
    view() { return routes[this.route] || BerandaView; },
    navs() {
      return [
        { label: 'Beranda', icon: '🏠', to: '#/' },
        { label: 'Kamar', icon: '🚪', to: '#/kamar' },
        { label: 'Penghuni', icon: '👥', to: '#/penghuni' },
        { label: 'Laporan', icon: '📊', to: '#/laporan' }
      ];
    }
  },
  methods: {
    isActive(to) { return this.route === to || (to !== '#/' && this.route.startsWith(to)); },
    toastClass() { return ui.toast.type === 'error' ? 'bg-danger' : 'bg-brand'; },
    guard() {
      if (needsAdmin(this.route) && !auth.admin) {
        intendedRoute = this.route;
        toast('Login admin diperlukan', 'error');
        location.hash = '#/login';
      }
    }
  },
  mounted() {
    window.addEventListener('hashchange', () => {
      this.route = location.hash || '#/';
      window.scrollTo(0, 0);
      this.guard();
    });
    refresh();
    this.guard();
  },
  template: `
  <div class="min-h-screen bg-bgapp max-w-md mx-auto pb-28">
    <transition name="page" mode="out-in">
      <component :is="view" :key="route"></component>
    </transition>

    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-40 px-4 pb-3">
      <div class="bg-surface rounded-[20px] border border-black/5 px-2 py-2 flex justify-around"
        style="box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .3)">
        <button v-for="n in navs" :key="n.to" @click="$go(n.to)"
          class="flex flex-col items-center gap-0.5 rounded-[16px] px-4 py-1.5 transition active:scale-95"
          :class="isActive(n.to) ? 'bg-navactive/12' : ''">
          <span class="text-lg leading-none transition" :class="isActive(n.to) ? 'text-navactive' : 'text-txt3'">{{ n.icon }}</span>
          <span class="text-[10px] leading-none pb-0.5" :class="isActive(n.to) ? 'text-navactive font-extrabold' : 'text-txt3 font-medium'">{{ n.label }}</span>
        </button>
      </div>
    </nav>

    <transition name="fade">
      <div v-if="ui.toast.msg" class="fixed z-50 bottom-28 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full text-white text-[14px] font-bold flex items-center gap-2 max-w-[85%]"
        :class="toastClass()" style="box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .35)">
        <span class="shrink-0" v-if="ui.toast.type !== 'error'">✓</span><span class="shrink-0" v-else>✕</span>
        <span>{{ ui.toast.msg }}</span>
      </div>
    </transition>
  </div>`
});

app.config.globalProperties.$go = h => { location.hash = h; };
app.config.globalProperties.rp = rp;
app.config.globalProperties.tgl = tgl;
app.config.globalProperties.maskHp = maskHp;
app.config.globalProperties.waLink = waLink;
app.config.globalProperties.jatuhTempo = jatuhTempo;
app.config.globalProperties.durasiSewa = durasiSewa;
app.config.globalProperties.ymLabel = ymLabel;
app.config.globalProperties.kamarNo = kamarNo;
app.config.globalProperties.store = store;
app.config.globalProperties.ui = ui;
app.config.globalProperties.auth = auth;
app.component('page-header', PageHeader);
app.mount('#app');
</script>
</body>
</html>
